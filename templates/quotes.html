<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes</title>
</head>
<body>
    <h1>Quotes</h1>

    <!-- Add a search form -->
    <form action="/search" method="get">
        <input type="text" name="author" placeholder="Search by author...">
        <input type="submit" value="Search">
    </form>

    <ul>
        {% for quote in quotes %}
            <li>
                <p>{{ quote.text }}</p>
                <p>- {{ quote.author }}</p>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
